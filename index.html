<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>vx.hub | Assets Source — VX Comunicação</title>
<meta name="description" content="O hub de arquivos da VX. Templates, logos, cores, fontes e tudo o que sua marca precisa.">
<style>
@font-face{font-family:"Herokid";src:url("/fonts/Herokid-Regular.woff2") format("woff2");font-weight:400;font-style:normal;font-display:swap}
@font-face{font-family:"Herokid";src:url("/fonts/Herokid-SemiBold.woff2") format("woff2");font-weight:600;font-style:normal;font-display:swap}
@font-face{font-family:"Herokid";src:url("/fonts/Herokid-Bold.woff2") format("woff2");font-weight:700;font-style:normal;font-display:swap}
@font-face{font-family:"Herokid";src:url("/fonts/Herokid-ExtraBold.woff2") format("woff2");font-weight:800;font-style:normal;font-display:swap}
:root{
  --lime:#C4FF4D;--turq:#18E0C8;--mint:#7FF5C4;--paper:#EAFFF6;
  --muted:rgba(234,255,246,.56);--line:rgba(127,245,196,.16);
  --display:"Herokid","Arial Black",system-ui,sans-serif;
  --body:"Herokid",system-ui,-apple-system,sans-serif;
  --mono:"Herokid",system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  min-height:100vh;color:var(--paper);font-family:var(--body);-webkit-font-smoothing:antialiased;
  background:
    radial-gradient(120% 80% at 6% -12%, rgba(196,255,77,.13), transparent 58%),
    radial-gradient(100% 70% at 100% 8%, rgba(24,224,200,.15), transparent 60%),
    radial-gradient(90% 60% at 50% 110%, rgba(24,224,200,.10), transparent 60%),
    linear-gradient(165deg,#04160F 0%,#03110E 42%,#051D1A 100%);
  background-attachment:fixed;
}
a{text-decoration:none;color:inherit}
:focus-visible{outline:2px solid var(--lime);outline-offset:3px}
#waves{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}

.shell{
  position:relative;z-index:1;max-width:1520px;margin:0 auto;padding:clamp(20px,3.4vw,52px);
  display:grid;grid-template-columns:minmax(230px,290px) 1fr;gap:clamp(24px,3.4vw,56px);align-items:start;
}
.rail{position:sticky;top:clamp(20px,3.4vw,52px)}
.lockup{display:block;line-height:0}
.lockup img{width:min(215px,66%);height:auto;display:block;transition:opacity .25s}
.lockup:hover img{opacity:.82}
.pagehead{display:flex;align-items:center;justify-content:space-between;gap:20px;flex-wrap:wrap}
.pagehead .lockup img{width:150px}
.badge{
  display:inline-block;margin-top:16px;padding:7px 16px 6px;border:1px solid var(--line);
  border-radius:999px;background:rgba(127,245,196,.06);font-family:var(--mono);font-size:10px;
  letter-spacing:.34em;text-transform:uppercase;color:var(--mint);
}
.rail h1{margin:28px 0 0;font-family:var(--display);font-weight:600;font-size:clamp(18px,1.6vw,22px);letter-spacing:-.02em;line-height:1.2}
.rail p{margin:13px 0 0;max-width:31ch;font-size:14.5px;line-height:1.65;color:var(--muted)}
.filters{margin-top:26px;display:flex;flex-wrap:wrap;gap:8px}
.chip{
  appearance:none;cursor:pointer;padding:8px 13px;border-radius:999px;border:1px solid var(--line);
  background:transparent;font-family:var(--mono);font-size:10.5px;letter-spacing:.14em;
  text-transform:uppercase;color:rgba(234,255,246,.68);
  transition:border-color .22s,color .22s,background .22s,transform .22s;
}
.chip:hover{color:var(--paper);border-color:rgba(127,245,196,.42);transform:translateY(-1px)}
.chip[aria-pressed="true"]{background:linear-gradient(100deg,var(--lime),var(--turq));border-color:transparent;color:#04160F;font-weight:700}
.tally{
  margin-top:22px;padding-top:17px;border-top:1px solid rgba(127,245,196,.12);
  font-family:var(--mono);font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:rgba(234,255,246,.42);
}
.vx{
  display:inline-flex;align-items:center;gap:9px;margin-top:18px;font-family:var(--mono);font-size:10px;
  letter-spacing:.2em;text-transform:uppercase;color:rgba(234,255,246,.45);transition:color .25s;
}
.vx::before{content:"";width:16px;height:1px;background:var(--mint);opacity:.7}
.vx:hover{color:var(--mint)}

.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:clamp(13px,1.3vw,20px)}
.tile{
  display:block;padding:1px;border-radius:19px;
  background:linear-gradient(140deg,var(--a),var(--b) 55%,var(--c));
  transition:transform .4s cubic-bezier(.2,.8,.25,1),box-shadow .4s;
  box-shadow:0 10px 30px -22px rgba(0,0,0,.9);
}
.tile:hover{transform:translateY(-5px);box-shadow:0 26px 60px -26px var(--glow)}
.inner{position:relative;overflow:hidden;border-radius:18px;aspect-ratio:4/3;background:var(--base,#04120F);display:grid;place-items:center}
.mesh{
  position:absolute;inset:-34%;filter:blur(42px);opacity:.92;
  background:
    radial-gradient(38% 44% at 28% 28%, var(--a), transparent 66%),
    radial-gradient(42% 46% at 74% 30%, var(--b), transparent 66%),
    radial-gradient(48% 52% at 38% 78%, var(--c), transparent 68%),
    radial-gradient(40% 42% at 84% 76%, var(--d), transparent 66%),
    var(--base,#072a24);
  animation:drift 22s ease-in-out infinite alternate;
}
@keyframes drift{
  0%{transform:translate3d(-2%,-1%,0) scale(1.02) rotate(0deg)}
  50%{transform:translate3d(3%,2%,0) scale(1.09) rotate(3deg)}
  100%{transform:translate3d(-3%,2%,0) scale(1.05) rotate(-3deg)}
}
.inner::after{
  content:"";position:absolute;inset:0;
  background:radial-gradient(260px 260px at var(--mx,50%) var(--my,50%), rgba(255,255,255,.18), transparent 68%);
  opacity:0;transition:opacity .4s;
}
.tile:hover .inner::after{opacity:1}
.face{position:relative;z-index:2;text-align:center;padding:18px;width:100%}
.face .group{display:block;font-family:var(--mono);font-size:9.5px;letter-spacing:.32em;text-transform:uppercase;color:rgba(255,255,255,.72);margin-bottom:11px}
.face .mark{margin:0;font-family:var(--display);font-weight:800;font-size:clamp(20px,2.1vw,34px);line-height:.9;letter-spacing:-.045em;text-transform:uppercase;color:#fff;text-shadow:0 4px 30px rgba(0,0,0,.32)}
.face .meta{display:block;margin-top:13px;font-family:var(--mono);font-size:9px;letter-spacing:.16em;text-transform:uppercase;color:rgba(255,255,255,0);transform:translateY(6px);transition:color .35s,transform .35s}
.tile:hover .meta{color:rgba(255,255,255,.84);transform:translateY(0)}
.tile.is-pale .mark{color:#0C1418;text-shadow:none}
.tile.is-pale .group{color:rgba(12,20,24,.6)}
.tile.is-pale:hover .meta{color:rgba(12,20,24,.75)}
.tile.is-off{display:none}

footer{
  grid-column:1/-1;margin-top:16px;padding-top:20px;border-top:1px solid rgba(127,245,196,.1);
  font-family:var(--mono);font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;
  color:rgba(234,255,246,.34);display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;
}
footer a:hover{color:var(--mint)}

/* ---------- página interna ---------- */
.page{position:relative;z-index:1;max-width:1180px;margin:0 auto;padding:clamp(20px,3.4vw,52px)}
.back{display:inline-flex;align-items:center;gap:10px;font-family:var(--mono);font-size:10.5px;letter-spacing:.2em;text-transform:uppercase;color:rgba(234,255,246,.5);transition:color .25s,gap .25s}
.back:hover{color:var(--mint);gap:14px}
.hero{margin-top:24px;padding:1px;border-radius:24px;background:linear-gradient(140deg,var(--a),var(--b) 55%,var(--c));box-shadow:0 30px 80px -40px var(--glow)}
.hero__in{position:relative;overflow:hidden;border-radius:23px;background:var(--base);min-height:clamp(210px,28vw,310px);display:grid;place-items:center;text-align:center;padding:42px 26px}
.hero__in .mesh{animation-duration:26s}
.hero__txt{position:relative;z-index:2}
.hero__txt .group{display:block;font-family:var(--mono);font-size:10px;letter-spacing:.34em;text-transform:uppercase;color:rgba(255,255,255,.75);margin-bottom:13px}
.hero__txt h1{margin:0;font-family:var(--display);font-weight:800;font-size:clamp(32px,5vw,68px);line-height:.88;letter-spacing:-.05em;text-transform:uppercase;color:#fff;text-shadow:0 6px 40px rgba(0,0,0,.3)}
.hero__txt p{margin:15px auto 0;max-width:46ch;font-size:15px;line-height:1.6;color:rgba(255,255,255,.8)}
.hero.is-pale .hero__txt h1{color:#0C1418;text-shadow:none}
.hero.is-pale .hero__txt .group{color:rgba(12,20,24,.62)}
.hero.is-pale .hero__txt p{color:rgba(12,20,24,.72)}

.section{margin-top:clamp(38px,4.6vw,64px)}
.section__head{display:flex;align-items:baseline;justify-content:space-between;gap:20px;flex-wrap:wrap;padding-bottom:13px;border-bottom:1px solid rgba(127,245,196,.14)}
.section__head h2{margin:0;font-family:var(--display);font-weight:600;font-size:clamp(20px,2.1vw,27px);letter-spacing:-.03em}
.count{font-family:var(--mono);font-size:10.5px;letter-spacing:.18em;text-transform:uppercase;color:rgba(234,255,246,.4)}
.drive{
  display:inline-flex;align-items:center;gap:10px;margin-top:20px;padding:11px 20px;border-radius:999px;
  background:linear-gradient(100deg,var(--lime),var(--turq));color:#04160F;font-family:var(--mono);
  font-size:10.5px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;transition:transform .25s,box-shadow .25s;
}
.drive:hover{transform:translateY(-2px);box-shadow:0 14px 30px -14px rgba(127,245,196,.6)}
.loading-state{min-height:100vh;display:grid;place-items:center;color:var(--muted);font-family:var(--mono);font-size:12px;letter-spacing:.2em;text-transform:uppercase}
.mark-logo{max-width:82%;max-height:100px;object-fit:contain;filter:drop-shadow(0 4px 20px rgba(0,0,0,.35))}
.tile.is-pale .mark-logo{filter:none}
.hero-logo{max-width:min(320px,72%);max-height:96px;object-fit:contain;filter:drop-shadow(0 6px 28px rgba(0,0,0,.35))}
.hero.is-pale .hero-logo{filter:none}
.mixed-grid{margin-top:20px;display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:13px}
.assets{margin-top:20px;display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:13px}
.asset,.font,.color,.empty{
  background:rgba(255,255,255,.07);
  backdrop-filter:blur(22px) saturate(160%);
  -webkit-backdrop-filter:blur(22px) saturate(160%);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.09),0 10px 30px -20px rgba(0,0,0,.6);
}
.asset{border:1px solid var(--line);border-radius:14px;overflow:hidden;transition:border-color .25s,transform .25s}
.asset:hover{border-color:rgba(127,245,196,.4);transform:translateY(-3px)}
.asset__sw{position:relative;height:130px;overflow:hidden;display:flex;align-items:center;justify-content:center;background-color:#16211c;background-image:repeating-conic-gradient(rgba(255,255,255,.11) 0 25%, transparent 0 50%);background-size:16px 16px}
.asset__img{max-width:100%;max-height:100%;width:auto;height:auto;object-fit:contain;padding:14px}
.asset__ph{font-size:26px;opacity:.4}
.asset__dot{width:42px;height:42px;border-radius:12px;border:1px solid rgba(255,255,255,.14);box-shadow:0 6px 20px -8px rgba(0,0,0,.8)}
.asset__lb{padding:11px 13px 13px;font-family:var(--mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:rgba(234,255,246,.62)}
.a-bar{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;gap:8px;background:rgba(4,22,15,.88);opacity:0;transition:opacity .25s}
.asset:hover .a-bar,.font:hover .a-bar{opacity:1}
.a-btn{width:32px;height:32px;border-radius:999px;border:1px solid rgba(255,255,255,.25);background:rgba(0,0,0,.35);color:#fff;display:grid;place-items:center;font-size:13px;cursor:pointer;text-decoration:none}
.a-btn:hover{background:rgba(0,0,0,.55);border-color:rgba(255,255,255,.5)}
.fonts{margin-top:20px;display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:13px}
.font{position:relative;border:1px solid var(--line);border-radius:14px;padding:22px 20px;transition:border-color .25s,transform .25s}
.font:hover{border-color:rgba(127,245,196,.4);transform:translateY(-3px)}
.font b{display:block;font-family:var(--display);font-weight:800;font-size:44px;line-height:1;letter-spacing:-.04em;color:var(--paper)}
.font span{display:block;margin-top:13px;font-family:var(--mono);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:rgba(234,255,246,.55)}
.codeblock{margin-top:20px;border:1px solid var(--line);border-radius:14px;overflow:hidden;background:rgba(0,0,0,.25)}
.codeblock pre{margin:0;padding:18px;overflow-x:auto;font-family:var(--mono);font-size:12px;color:var(--paper)}
.colors{margin-top:20px;display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:13px}
.color{border:1px solid var(--line);border-radius:14px;overflow:hidden}
.color__sw{height:92px;position:relative;display:flex;align-items:flex-start;justify-content:flex-end;padding:8px}
.color__sw .a-btn{opacity:0;transition:opacity .25s}
.color:hover .color__sw .a-btn{opacity:1}
.color__in{padding:13px 14px 15px;font-family:var(--mono);font-size:10px;letter-spacing:.06em;color:rgba(234,255,246,.55);line-height:1.9}
.color__in b{display:block;font-size:12px;letter-spacing:.12em;color:var(--paper);margin-bottom:5px}
.color__in .copyline{cursor:pointer;border-radius:6px;margin:0 -6px;padding:1px 6px;transition:background .15s,color .15s}
.color__in .copyline:hover{background:rgba(127,245,196,.12);color:var(--paper)}
.lightbox{position:fixed;inset:0;z-index:200;display:grid;place-items:center;padding:40px;background:rgba(2,10,7,0);opacity:0;transition:opacity .25s,background .25s;pointer-events:none}
.lightbox.open{opacity:1;background:rgba(2,10,7,.9);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);pointer-events:auto}
.lightbox img,.lightbox video{max-width:100%;max-height:100%;border-radius:14px;box-shadow:0 30px 90px -30px rgba(0,0,0,.85)}
.lightbox__close{position:absolute;top:22px;right:26px;width:40px;height:40px;border-radius:999px;border:1px solid rgba(255,255,255,.25);background:rgba(0,0,0,.4);color:#fff;font-size:16px;cursor:pointer;display:grid;place-items:center}
.lightbox__close:hover{background:rgba(0,0,0,.6);border-color:rgba(255,255,255,.5)}
.guide{margin-top:20px;border:1px solid var(--line);border-radius:16px;overflow:hidden;background:rgba(0,0,0,.25)}
.guide iframe{display:block;width:100%;height:min(68vh,600px);border:0}
.empty{margin-top:20px;padding:32px 24px;border:1px dashed rgba(127,245,196,.28);border-radius:16px;font-size:14.5px;line-height:1.65;color:var(--muted);max-width:60ch}
.empty b{display:block;font-family:var(--mono);font-size:10.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--mint);margin-bottom:9px;font-weight:400}
.nextnav{margin-top:clamp(40px,4.6vw,66px);padding-top:20px;border-top:1px solid rgba(127,245,196,.12);display:flex;gap:10px;flex-wrap:wrap}
.nextnav a{padding:9px 15px;border:1px solid var(--line);border-radius:999px;font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:rgba(234,255,246,.6);transition:color .22s,border-color .22s,transform .22s}
.nextnav a:hover{color:var(--paper);border-color:rgba(127,245,196,.45);transform:translateY(-2px)}

@media(max-width:1080px){.grid{grid-template-columns:repeat(2,1fr)}}
@media(max-width:900px){.shell{grid-template-columns:1fr}.rail{position:static}}
@media(max-width:560px){.grid{grid-template-columns:1fr}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition-duration:.01ms!important}}
</style>
</head>

  }
  function frame(now){
    var t=now/1000; ctx.clearRect(0,0,w,h);
    if(mouse.on){ mouse.x+=(mouse.tx-mouse.x)*0.07; mouse.y+=(mouse.ty-mouse.y)*0.07; }
    for(var i=ripples.length-1;i>=0;i--){ if(t-ripples[i].t0>1.8) ripples.splice(i,1); }
    ctx.strokeStyle=grad;
    for(var l=0;l<lines;l++){
      drawLine(-60+(h+120)*(l/(lines-1)), 8+9*Math.sin(l*0.33), l*0.38, t);
    }
    ctx.globalAlpha=1; requestAnimationFrame(frame);
  }
  if(reduce){
    ctx.strokeStyle=grad; ctx.globalAlpha=.1;
    for(var l=0;l<lines;l++){
      var baseY=-60+(h+120)*(l/(lines-1)); ctx.beginPath();
      for(var x=0;x<=w;x+=STEP){ var y=baseY+Math.sin(x*0.0048+l*0.38)*10; x===0?ctx.moveTo(x,y):ctx.lineTo(x,y); }
      ctx.stroke();
    }
  } else requestAnimationFrame(frame);
})();

/* alguns arquivos de logo têm bastante espaço vazio/transparente ao redor da marca,
   fazendo eles parecerem menores que os outros dentro do mesmo box. Isso recorta
   essa margem, sem afetar o arquivo original. Se não der (ex: CORS), a imagem
   original continua sendo exibida normalmente. */
function trimLogoPadding(imgEl){
  if(!imgEl || !imgEl.src) return;
  var probe = new Image();
  probe.crossOrigin = 'anonymous';
  probe.onload = function(){
    try{
      var w = probe.naturalWidth, h = probe.naturalHeight;
      if(!w || !h) return;
      var canvas = document.createElement('canvas');
      canvas.width = w; canvas.height = h;
      var ctx = canvas.getContext('2d');
      ctx.drawImage(probe, 0, 0);
      var data = ctx.getImageData(0, 0, w, h).data;
      var top = h, bottom = 0, left = w, right = 0, THRESH = 10;
      for(var y = 0; y < h; y++){
        for(var x = 0; x < w; x++){
          if(data[(y * w + x) * 4 + 3] > THRESH){
            if(y < top) top = y;
            if(y > bottom) bottom = y;
            if(x < left) left = x;
            if(x > right) right = x;
          }
        }
      }
      if(right <= left || bottom <= top) return;
      var tw = right - left + 1, th = bottom - top + 1;
      if((tw * th) / (w * h) > 0.85) return;
      var out = document.createElement('canvas');
      out.width = tw; out.height = th;
      out.getContext('2d').drawImage(canvas, left, top, tw, th, 0, 0, tw, th);
      imgEl.src = out.toDataURL('image/png');
    }catch(e){ /* CORS ou outra falha: mantém a imagem original */ }
  };
  probe.onerror = function(){};
  probe.src = imgEl.src;
}

/* deixa os logos com "peso visual" parecido: em vez de só caber numa caixa
   (o que faz um logo largo tipo wordmark parecer bem maior que um ícone
   quadrado), calcula o tamanho de cada um mirando a mesma área aproximada,
   respeitando a proporção real do arquivo (sem esticar/distorcer). */
function fitLogo(imgEl,opts){
  if(!imgEl) return;
  opts=opts||{};
  function apply(){
    var w = imgEl.naturalWidth, h = imgEl.naturalHeight;
    if(!w || !h) return;
    var container = imgEl.closest(opts.container||'.face');
    var maxW = (container ? container.clientWidth : 260) * (opts.maxWRatio||0.82);
    var maxH = opts.maxH||100;
    var BASE = opts.base||78;
    var ratio = w / h;
    var targetW = BASE * Math.sqrt(ratio);
    var targetH = BASE / Math.sqrt(ratio);
    var scale = Math.min(maxW / targetW, maxH / targetH, 1);
    imgEl.style.width = Math.round(targetW * scale) + 'px';
    imgEl.style.height = Math.round(targetH * scale) + 'px';
  }
  imgEl._fitLogoApply = apply;
  imgEl.addEventListener('load', apply);
  if(imgEl.complete && imgEl.naturalWidth) apply();
}

      });

})();

function home(){
  loading();
  Promise.all([
    fetchJSON(API_BASE+'/site-content').catch(function(){return null;}),

  ]).then(function(res){

function renderHome(){
  var tiles = BRANDS_LIST.map(function(b){
    var g=gradFor(b);
    var mark = b.logo_url
      ? '<img class="mark-logo" src="'+esc(b.logo_url)+'" alt="'+esc(b.name)+'">'
      : '<h2 class="mark">'+b.display_html+'</h2>';
    return '<a class="tile'+(b.grad_pale?' is-pale':'')+'" href="#/marca/'+esc(b.slug)+'" data-group="'+esc(b.filter_key)+'" style="'+vars(g)+'">'+
      '<div class="inner"><div class="mesh"></div><div class="face">'+
        '<span class="group">'+esc(b.brand_group)+'</span>'+
        mark+
        '<span class="meta">logos · fontes · cores · brandguide</span>'+
      '</div></div></a>';
  }).join('');

  var chipsHtml = '<button class="chip" data-filter="todos" aria-pressed="true">Todos</button>'+
    CATEGORIES.map(function(c){ return '<button class="chip" data-filter="'+c.key+'" aria-pressed="false">'+esc(c.label)+'</button>'; }).join('');

  app.innerHTML =
  '<div class="shell"><header class="rail">'+
    '<a class="lockup" href="#/"><img src="'+(siteContent.logo_url||LOGO)+'" alt="vx.hub"></a>'+
    '<div class="badge">'+esc(siteContent.subtitle||'Assets Source')+'</div>'+
    '<h1>'+esc(siteContent.title||'')+'</h1>'+
    '<p>'+esc(siteContent.description||'')+'</p>'+
    '<div class="filters" role="group" aria-label="Filtrar por grupo">'+chipsHtml+'</div>'+
    '<div class="tally"><span id="tally">'+BRANDS_LIST.length+'</span> de '+BRANDS_LIST.length+' marcas</div>'+
    '<a class="vx" href="https://vxcomunicacao.com.br/" target="_blank" rel="noopener">Desenvolvido pela VX</a>'+
  '</header><main><div class="grid" id="grid">'+tiles+'</div></main>'+
  '<footer><span>vx.hub · Assets Source</span>'+
  '<a href="https://vxcomunicacao.com.br/" target="_blank" rel="noopener">VX Comunicação</a></footer></div>';

  wireTiles();
  app.querySelectorAll('.mark-logo').forEach(function(img){
    fitLogo(img);
    trimLogoPadding(img);
  });
  var chips=app.querySelectorAll('.chip'), tiless=app.querySelectorAll('.tile'), tally=app.querySelector('#tally');
  chips.forEach(function(chip){
    chip.addEventListener('click',function(){
      chips.forEach(function(c){c.setAttribute('aria-pressed',String(c===chip));});
      var f=chip.dataset.filter,n=0;
      tiless.forEach(function(t){
        var show=(f==='todos'||t.dataset.group===f);
        t.classList.toggle('is-off',!show); if(show)n++;
      });
      tally.textContent=n;
    });
  });
}

function wireTiles(){
  app.querySelectorAll('.tile').forEach(function(tile){
    var inner=tile.querySelector('.inner');
    tile.addEventListener('pointermove',function(e){
      var r=tile.getBoundingClientRect();
      inner.style.setProperty('--mx',((e.clientX-r.left)/r.width*100)+'%');
      inner.style.setProperty('--my',((e.clientY-r.top)/r.height*100)+'%');
    },{passive:true});
  });
}

/* ---- blocos da página interna ---- */
var GRID_TYPES=['image_download','video','font_card','color_palette'];
var loadedFonts={};

function ensureFont(label,url){
  if(!url) return null;
  if(loadedFonts[url]) return loadedFonts[url];
  var family='CustomFont_'+Math.random().toString(36).slice(2,10);
  var style=document.createElement('style');
  style.textContent='@font-face{font-family:"'+family+'";src:url("'+url+'");font-display:swap;}';
  document.head.appendChild(style);
  loadedFonts[url]=family;
  return family;
}

function actionBar(block,opts){
  opts=opts||{};
  var downloadUrl=block.file_url||block.font_file_url||'';
  var copyUrl=block.external_url||downloadUrl;
  var btns='';
  if(opts.expandable!==false) btns+='<button class="a-btn" data-act="expand" title="Expandir">⤢</button>';
  if(downloadUrl) btns+='<button class="a-btn" data-act="download" data-url="'+esc(downloadUrl)+'" title="Baixar">⬇</button>';
  if(copyUrl) btns+='<button class="a-btn" data-act="copy" data-url="'+esc(copyUrl)+'" title="Copiar link">🔗</button>';
  btns+='<button class="a-btn" data-act="share" data-url="'+esc(copyUrl||location.href)+'" title="Compartilhar">⤴</button>';
  return '<div class="a-bar">'+btns+'</div>';
}

function renderBlock(block){
  switch(block.block_type){
    case 'image_download':
      return '<div class="asset"><div class="asset__sw">'+
        (block.file_url?'<img class="asset__img" src="'+esc(block.file_url)+'" alt="'+esc(block.title||'')+'">':'<span class="asset__ph">🖼</span>')+
        actionBar(block)+'</div>'+
        '<div class="asset__lb">'+esc(block.title||'sem nome')+'</div></div>';
    case 'video':
      return '<div class="asset"><div class="asset__sw">'+
        (block.file_url?'<video class="asset__img" src="'+esc(block.file_url)+'" controls></video>':'<span class="asset__ph">🎬</span>')+
        actionBar(block)+'</div>'+
        '<div class="asset__lb">'+esc(block.title||'sem nome')+'</div></div>';
    case 'font_card':
      var fam=ensureFont(block.title,block.font_file_url||block.file_url);
      return '<div class="font"><b'+(fam?' style="font-family:\''+fam+'\'"':'')+'>Aa</b>'+
        '<span>'+esc(block.title||block.font_name||'')+'</span>'+actionBar(block,{expandable:false})+'</div>';
    case 'color_palette':
      return '<div class="color"><div class="color__sw" style="background:'+esc(block.color_hex||'#222')+'">'+
        (block.color_hex?'<button class="a-btn" data-act="copy" data-url="'+esc(block.color_hex)+'" title="Copiar HEX">🔗</button>':'')+
        '</div><div class="color__in">'+
        (block.color_hex?'<b class="copyline" data-act="copy" data-url="'+esc(block.color_hex)+'" title="Copiar HEX">HEX '+esc(block.color_hex.replace('#',''))+'</b>':'')+
        (block.color_rgb?'<div class="copyline" data-act="copy" data-url="'+esc(block.color_rgb)+'" title="Copiar RGB">RGB '+esc(block.color_rgb)+'</div>':'')+
        (block.color_cmyk?'<div class="copyline" data-act="copy" data-url="'+esc(block.color_cmyk)+'" title="Copiar CMYK">CMYK '+esc(block.color_cmyk)+'</div>':'')+
        (block.color_pantone?'<div class="copyline" data-act="copy" data-url="'+esc(block.color_pantone)+'" title="Copiar Pantone">Pantone '+esc(block.color_pantone)+'</div>':'')+
      '</div></div>';
    case 'pdf_viewer':
      return '<div class="guide"><iframe src="'+esc(block.external_url||'')+'" title="'+esc(block.title||'PDF')+'" loading="lazy"></iframe></div>';
    case 'code_snippet':
      return '<div class="codeblock"><pre><code>'+esc(block.code_content||'')+'</code></pre>'+
        (block.title?'<div class="asset__lb">'+esc(block.title)+(block.code_language?' ('+esc(block.code_language)+')':'')+'</div>':'')+'</div>';
    case 'link_item':
    default:
      return '<a class="drive" href="'+esc(block.external_url||'#')+'" target="_blank" rel="noopener">'+esc(block.title||block.external_url||'Abrir link')+'</a>';
  }
}

function brandPage(slug){
  loading();
  fetchJSON(API_BASE+'/brands/'+encodeURIComponent(slug)).then(renderBrandPage).catch(function(){
    location.hash='#/';
  });
}

function renderBrandPage(b){
  var g=gradFor(b);
  var heroMark = b.logo_url
    ? '<img class="hero-logo" src="'+esc(b.logo_url)+'" alt="'+esc(b.name)+'">'
    : '<h1>'+b.display_html+'</h1>';

  var html='<div class="page"><div class="pagehead"><a class="lockup" href="#/"><img src="'+(siteContent.logo_url||LOGO)+'" alt="vx.hub"></a><a class="back" href="#/">← Assets Source</a></div>'+
  '<div class="hero'+(b.grad_pale?' is-pale':'')+'" style="'+vars(g)+'"><div class="hero__in"><div class="mesh"></div>'+
    '<div class="hero__txt"><span class="group">'+esc(b.brand_group)+'</span>'+heroMark+
    '<p>'+esc(b.description||'')+'</p></div></div></div>';

  (b.sections||[]).forEach(function(section){
    var blocks=section.blocks||[];
    var gridBlocks=blocks.filter(function(bl){return GRID_TYPES.indexOf(bl.block_type)>=0;});
    var flowBlocks=blocks.filter(function(bl){return GRID_TYPES.indexOf(bl.block_type)<0;});
    html+='<section class="section"><div class="section__head"><h2>'+esc(section.title)+'</h2><span class="count">'+blocks.length+' itens</span></div>';
    if(gridBlocks.length) html+='<div class="mixed-grid">'+gridBlocks.map(renderBlock).join('')+'</div>';
    flowBlocks.forEach(function(bl){ html+=renderBlock(bl); });
    if(!blocks.length) html+='<div class="empty"><b>Sem itens ainda</b>Assim que os arquivos dessa seção forem publicados, eles aparecem aqui.</div>';
    html+='</section>';
  });

  html+='<nav class="nextnav">'+BRANDS_LIST.filter(function(x){return x.slug!==b.slug;}).map(function(x){
    return '<a href="#/marca/'+esc(x.slug)+'">'+esc(x.name)+'</a>';
  }).join('')+'</nav></div>';

  app.innerHTML=html;
  document.title=b.name+' | Assets Source — VX Comunicação';

  var heroLogoEl=app.querySelector('.hero-logo');
  if(heroLogoEl){
    fitLogo(heroLogoEl,{container:'.hero__txt',maxWRatio:0.72,maxH:96,base:92});
    trimLogoPadding(heroLogoEl);
  }
}

function downloadFile(url){
  if(!url) return;
  fetch(url).then(function(r){
    if(!r.ok) throw new Error('http '+r.status);
    return r.blob();
  }).then(function(blob){
    var blobUrl=URL.createObjectURL(blob);
    var a=document.createElement('a');
    a.href=blobUrl;
    a.download=(url.split('/').pop()||'arquivo').split('?')[0];
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(function(){URL.revokeObjectURL(blobUrl);},4000);
  }).catch(function(){
    window.open(url,'_blank');
  });
}

function openLightbox(src,tag){
  var overlay=document.createElement('div');
  overlay.className='lightbox';
  overlay.innerHTML=(tag==='video'
    ? '<video src="'+esc(src)+'" controls autoplay></video>'
    : '<img src="'+esc(src)+'" alt="">')+
    '<button class="lightbox__close" title="Fechar">✕</button>';
  document.body.appendChild(overlay);
  requestAnimationFrame(function(){overlay.classList.add('open');});
  function close(){
    overlay.classList.remove('open');
    document.removeEventListener('keydown',onKey);
    setTimeout(function(){overlay.remove();},250);
  }
  function onKey(e){ if(e.key==='Escape') close(); }
  overlay.addEventListener('click',function(e){ if(e.target===overlay) close(); });
  overlay.querySelector('.lightbox__close').addEventListener('click',close);
  document.addEventListener('keydown',onKey);
}

app.addEventListener('click',function(e){
  var btn=e.target.closest('[data-act]');
  if(!btn) return;
  var act=btn.dataset.act;
  if(act==='copy'){
    if(navigator.clipboard) navigator.clipboard.writeText(btn.dataset.url).then(function(){
      var old=btn.textContent; btn.textContent='✓'; setTimeout(function(){btn.textContent=old;},1200);
    });
  } else if(act==='share'){
    if(navigator.share) navigator.share({url:btn.dataset.url}).catch(function(){});
    else if(navigator.clipboard) navigator.clipboard.writeText(btn.dataset.url);
  } else if(act==='download'){
    downloadFile(btn.dataset.url);
  } else if(act==='expand'){
    var media=btn.closest('.asset__sw');
    var el=media&&media.querySelector('img,video');
    if(el) openLightbox(el.currentSrc||el.src,el.tagName.toLowerCase());
  }
});

function route(){
  var m=(location.hash||'#/').match(/^#\/marca\/(.+)$/);
  if(m) brandPage(decodeURIComponent(m[1]));
  else home();
  window.scrollTo(0,0);
}
window.addEventListener('hashchange',route);
route();
